[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytchannelpickcheck"
version = "0.1.0"
description = "Research/backtesting tool for Korean YouTube stock recommendation channels"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Codex"}]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "requests>=2.31",
  "pandas>=2.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "youtube-transcript-api>=0.6",
  "pykrx>=1.0.48",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ytchannelpickcheck = "ytchannelpickcheck.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
